name: CI - Test, Build, Scan, Push

on:
push:
branches: [main]
pull_request:
branches: [main]

env:
IMAGE_NAME: lab-app
IMAGE_TAG: ${{ github.sha }}

jobs:
test:
name: Unit Tests
runs-on: ubuntu-latest

```
steps:
  - uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: "20"
      cache: "npm"

  - name: Install dependencies
    run: npm ci

  - name: Run tests
    run: npm test
```

build-and-push:
name: Build, Scan & Push to ACR
runs-on: ubuntu-latest
needs: test
if: github.ref == 'refs/heads/main'

```
steps:
  - uses: actions/checkout@v4

  - name: Log in to Azure
    uses: azure/login@v2
    with:
      client-id: ${{ secrets.AZURE_CLIENT_ID }}
      tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

  - name: Log in to ACR
    run: az acr login --name ${{ secrets.ACR_NAME }}

  - name: Build image
    run: |
      docker build \
        --tag production \
        --tag ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
        --tag ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
        .

  - name: Scan image with Trivy
    uses: aquasecurity/trivy-action@master
    with:
      image-ref: production
      format: table
      exit-code: '1'
      severity: HIGH,CRITICAL
      ignore-unfixed: true

  - name: Push image to ACR
    run: |
      docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
      docker push ${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

  - name: Summary
    run: |
      echo "### Image pushed successfully 🚀" >> $GITHUB_STEP_SUMMARY
      echo "Registry: ${{ secrets.ACR_NAME }}.azurecr.io" >> $GITHUB_STEP_SUMMARY
      echo "Tag: ${{ env.IMAGE_TAG }}" >> $GITHUB_STEP_SUMMARY
```
